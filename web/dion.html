<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mercenary III</title>
    <link rel="stylesheet" href="/src/shell/chrome.css" />
    <link rel="stylesheet" href="/src/shell/panelControls.css" />
    <style>
      @font-face {
        font-family: 'Damocles Interface';
        src: url('/payload/fonts/damocles.woff2') format('woff2');
        font-display: swap;
      }

      :root {
        color-scheme: dark;
        --text: #f4f7f8;
        --muted: #b7cad2;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      body {
        color: var(--text);
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      /* The System Menu's tokens (ADR 0063), starting from Damocles's: the same engine's chrome. */
      #game-surface {
        display: grid;
        grid-template-rows: minmax(0, 100%);
        place-items: center;
        width: 100%;
        height: 100%;
        --panel-face: #9aa0a0;
        --panel-hi: #ced4d4;
        --panel-lo: #43484a;
        --lcd-bg: #060606;
        --lcd-ink: #3ecf3e;
        --cell-border: #9aa0a0;
        --label-ink: #2c3032;
        --lamp-on: #aaccaa;
        --panel-font: 'Damocles Interface', 'Courier New', monospace;
        --console-ink: #3ecf3e;
      }

      /* The ST's low-resolution screen, 320 by 200, shown at whole-pixel scale where it fits.
         Its pixels are not square on a real monitor; the browser shows them square. */
      #dion-screen {
        position: relative;
        width: min(100vw, 160vh);
        aspect-ratio: 320 / 200;
      }

      #screen {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        outline: none;
        touch-action: manipulation;
      }

      /* Enhanced: Damocles's viewer (ADR 0077). The view fills the surface above the panel,
         whose ST pixels have a canvas of their own below it. */
      #dion-screen[data-presentation='enhanced'] {
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        width: min(100%, 1280px);
        height: 100%;
        aspect-ratio: auto;
      }

      #dion-screen[data-presentation='enhanced'] #screen {
        display: none;
      }

      #dion-enhanced-view {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 0;
        outline: none;
        touch-action: manipulation;
      }

      #dion-panel {
        display: block;
        width: 100%;
        aspect-ratio: 320 / 64;
        image-rendering: pixelated;
        pointer-events: none;
      }

      /* The panel's controls cover its 64 rows, the bottom of the screen in either presentation. */
      #dion-panel-controls {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        aspect-ratio: 320 / 64;
        pointer-events: none;
      }

      #dion-screen:not([data-presentation='enhanced']) #dion-enhanced-view,
      #dion-screen:not([data-presentation='enhanced']) #dion-panel {
        display: none;
      }

      #status,
      #failure {
        position: absolute;
        z-index: 2;
        top: 1rem;
        left: 1rem;
        max-width: min(32rem, calc(100% - 2rem));
        margin: 0;
        padding: 0.75rem 1rem;
        color: var(--muted);
        background: #07151dec;
        border-left: 3px solid #2d7697;
        line-height: 1.6;
      }

      [hidden] {
        display: none !important;
      }

      [role='alert'] {
        color: #ffd7d7;
        border-left: 3px solid #c85e5e;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <section
      id="game-surface"
      data-layer="none"
      aria-label="Mercenary III Game Surface"
    >
      <div id="dion-screen">
        <canvas
          id="screen"
          width="320"
          height="200"
          role="img"
          aria-label="METIS, TIMEWARP PRISON"
          tabindex="0"
          hidden
        >
          Your browser cannot display the Mercenary III view.
        </canvas>
        <div id="dion-panel-controls"></div>
      </div>
      <p id="status" role="status">Loading Mercenary III…</p>
      <p id="failure" role="alert" hidden></p>
    </section>
    <script type="module" src="/src/dion/boot.ts"></script>
  </body>
</html>
