<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="/src/damocles/panel.css" />
    <link rel="stylesheet" href="/src/shell/panelControls.css" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Damocles</title>
    <link rel="stylesheet" href="/src/shell/damoclesPanel.css" />
    <link rel="stylesheet" href="/src/shell/chrome.css" />
    <style>
      @font-face {
        font-family: 'Damocles Interface';
        src: url('/payload/fonts/damocles.woff2') format('woff2');
        font-display: swap;
      }

      :root {
        color-scheme: dark;
        --text: #f4f7f8;
        --muted: #b7cad2;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      body {
        color: var(--text);
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      #game-surface {
        display: grid;
        grid-template-rows: 1fr auto;
        width: min(100%, 1280px);
        height: 100%;
        margin-inline: auto;
        --panel-face: #9aa0a0;
        --panel-hi: #ced4d4;
        --panel-lo: #43484a;
        --lcd-bg: #060606;
        --lcd-ink: #3ecf3e;
        --cell-border: #9aa0a0;
        --label-ink: #2c3032;
        --lamp-on: #aaccaa;
        --panel-font: 'Damocles Interface', 'Courier New', monospace;
        --console-ink: #3ecf3e;
      }

      #frame {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 0;
        outline: none;
        touch-action: manipulation;
      }

      #frame,
      #frame-noise {
        grid-area: 1 / 1;
      }

      #panel {
        grid-area: 2 / 1;
      }

      #frame-noise {
        width: 100%;
        height: 100%;
        min-height: 0;
        image-rendering: pixelated;
        pointer-events: none;
      }

      #frame[data-take-target] {
        cursor: pointer;
      }

      #panel {
        width: 100%;
        aspect-ratio: 320 / 64;
        overflow: hidden;
        background: #101010;
      }

      #panel-scale {
        width: 1280px;
        transform-origin: top left;
        scale: var(--panel-scale, 1);
      }

      #status,
      #failure {
        position: absolute;
        z-index: 2;
        top: 1rem;
        left: 1rem;
        max-width: min(32rem, calc(100% - 2rem));
        margin: 0;
        padding: 0.75rem 1rem;
        color: var(--muted);
        background: #07151dec;
        border-left: 3px solid #2d7697;
        line-height: 1.6;
      }

      [hidden] {
        display: none !important;
      }

      [role='alert'] {
        color: #ffd7d7;
        border-left: 3px solid #c85e5e;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <section
      id="game-surface"
      data-layer="none"
      aria-label="Damocles Game Surface"
    >
      <canvas id="frame" role="img" aria-label="Eris, on foot" hidden>
        Your browser cannot display the Damocles world view.
      </canvas>
      <canvas id="frame-noise" aria-hidden="true" hidden></canvas>
      <section id="panel" role="region" aria-label="Damocles panel" hidden>
        <div id="panel-scale">
          <damocles-game-panel
            id="panel-damocles"
            data-title="DAMOCLES"
            data-head-controls
          ></damocles-game-panel>
        </div>
      </section>
      <p id="status" role="status">Loading Damocles…</p>
      <p id="failure" role="alert" hidden></p>
    </section>
    <script type="module" src="/src/damocles/boot.ts"></script>
  </body>
</html>
