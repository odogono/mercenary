<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Damocles</title>
    <link rel="stylesheet" href="/src/shell/damoclesPanel.css" />
    <style>
      @font-face {
        font-family: 'Damocles Interface';
        src: url('/payload/fonts/damocles.woff2') format('woff2');
        font-display: swap;
      }

      :root {
        color-scheme: dark;
        --text: #f4f7f8;
        --muted: #b7cad2;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      body {
        color: var(--text);
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      /* The ST screen: a 1280-wide world view over the 244-pixel Damocles panel (ADR 0027). */
      main {
        display: grid;
        grid-template-rows: 1fr auto;
        width: min(100%, 1280px);
        height: 100%;
        margin-inline: auto;
      }

      #frame {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 0;
        outline: none;
      }

      #panel {
        width: 100%;
        aspect-ratio: 1280 / 244;
        overflow: hidden;
        background: #101010;
      }

      #panel-scale {
        width: 1280px;
        transform-origin: top left;
        scale: var(--panel-scale, 1);
      }

      p {
        position: absolute;
        z-index: 2;
        top: 1rem;
        left: 1rem;
        max-width: min(32rem, calc(100% - 2rem));
        margin: 0;
        padding: 0.75rem 1rem;
        color: var(--muted);
        background: #07151dec;
        border-left: 3px solid #2d7697;
        line-height: 1.6;
      }

      [hidden] {
        display: none;
      }

      [role='alert'] {
        color: #ffd7d7;
        border-left: 3px solid #c85e5e;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <canvas id="frame" role="img" aria-label="Eris, on foot" hidden>
        Your browser cannot display the Damocles world view.
      </canvas>
      <section id="panel" role="region" aria-label="Damocles panel" hidden>
        <div id="panel-scale">
          <damocles-panel id="panel-damocles"></damocles-panel>
        </div>
      </section>
      <p id="status" role="status">Loading Damocles…</p>
      <p id="failure" role="alert" hidden></p>
    </main>
    <script type="module" src="/src/damocles/boot.ts"></script>
  </body>
</html>
