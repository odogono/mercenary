<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Damocles · Gamma Atlas</title>
    <link rel="stylesheet" href="/src/atlas/atlas.css" />
  </head>
  <body>
    <main id="atlas" aria-label="Gamma Atlas">
      <section class="stage">
        <h1 id="title">Gamma Atlas</h1>
        <nav id="breadcrumb" aria-label="Atlas Ranges"></nav>
        <div id="system-toolbar">
          <button id="system-zoom-out" aria-label="Zoom the System Range out">
            &#8722;
          </button>
          <button id="system-zoom-in" aria-label="Zoom the System Range in">
            +
          </button>
          <button id="system-fit">Fit System</button>
          <a id="return-game" href="/damocles">Return to Game</a>
          <button id="recenter-player" hidden>Show player</button>
          <span id="system-scale" class="muted"></span>
        </div>
        <div
          id="range-system"
          class="range"
          tabindex="0"
          aria-label="System Range. Every recovered Body of the Gamma System, drawn on the X/Z plane. Drag to pan, scroll or double-click to zoom, arrow keys pan, plus and minus zoom, zero fits the System."
        >
          <canvas id="system-map"></canvas>
          <div id="system-labels" aria-hidden="true"></div>
          <div id="system-centre" class="centre-readout" role="status"></div>
        </div>
        <div
          id="range-body"
          class="range"
          tabindex="0"
          aria-label="Body Range. The surface of one Body, which wraps on both axes. Drag to pan, scroll or double-click to zoom, arrow keys pan, plus and minus zoom, zero fits the surface, zooming out past the surface returns to the Gamma System."
          hidden
        >
          <canvas id="body-map"></canvas>
          <span
            id="atlas-player"
            class="atlas-marker player-marker"
            role="img"
            aria-label="Player position when play paused"
            title="Drag to move the player here. Escape cancels. You can also place a pin and choose Travel Here."
            hidden
          >
            <svg class="player-cone" viewBox="0 0 100 100" aria-hidden="true">
              <path d="M50 50 L20 4 Q50 -7 80 4 Z" />
            </svg>
            <svg class="player-person" viewBox="0 0 32 40" aria-hidden="true">
              <circle cx="16" cy="8" r="6" />
              <path
                d="M10 17 Q16 14 22 17 L25 27 L21 28 L20 37 H12 L11 28 L7 27 Z"
              />
            </svg>
          </span>
          <button
            id="atlas-pin"
            class="atlas-marker pin-marker"
            aria-label="Atlas Pin. Open travel menu"
            aria-haspopup="menu"
            aria-controls="pin-menu"
            aria-expanded="false"
            hidden
          >
            <svg viewBox="0 0 32 40" aria-hidden="true">
              <path
                d="M9 36 V5 M10 6 C17 1 21 11 28 6 V22 C21 27 17 17 10 22"
              />
            </svg>
          </button>
          <div id="pin-menu" role="menu" aria-label="Atlas Pin" hidden>
            <button id="pin-menu-travel" role="menuitem">Travel Here</button>
          </div>
          <div
            id="body-labels"
            aria-label="Settlements and Damocles Places"
          ></div>
          <div id="body-centre" class="centre-readout" role="status"></div>
        </div>
        <p id="status" role="status"></p>
        <p id="failure" role="alert" hidden></p>
      </section>
      <aside class="sidebar">
        <section id="pin-panel" aria-labelledby="pin-heading">
          <h2 id="pin-heading">Atlas Pin</h2>
          <p id="pin-coordinates"></p>
          <div class="pin-actions">
            <button id="show-pin" disabled>Show pin</button>
            <button id="travel-here" disabled>Travel Here</button>
          </div>
          <p id="pin-status" role="status"></p>
        </section>
        <section id="search" aria-labelledby="search-heading">
          <h2 id="search-heading">Search</h2>
          <form id="search-form" role="search">
            <label for="search-q">Name or record id</label>
            <input
              id="search-q"
              type="search"
              autocomplete="off"
              spellcheck="false"
            />
            <div class="search-filters">
              <label
                >Kind
                <select id="search-kind">
                  <option value="">Every kind</option>
                  <option value="body">Bodies</option>
                  <option value="settlement">Settlements</option>
                  <option value="place">Damocles Places</option>
                  <option value="model">Models</option>
                  <option value="instance">Instances</option>
                </select></label
              >
              <label
                >Body
                <select id="search-body">
                  <option value="">Whole System</option>
                </select></label
              >
            </div>
          </form>
          <p id="search-status" role="status"></p>
          <button id="search-retry" type="button" hidden>Try again</button>
          <ol id="search-results"></ol>
          <button id="search-more" type="button" hidden></button>
          <section
            id="search-model"
            aria-label="Model placements"
            hidden
          ></section>
        </section>
        <section id="panel" aria-label="Selection"></section>
        <section class="roster-section">
          <h2>Roster</h2>
          <nav id="roster" aria-label="Recovered Bodies"></nav>
        </section>
      </aside>
    </main>
    <script type="module" src="/src/atlas/boot.ts"></script>
  </body>
</html>
