<!doctype html>
<html lang="en" data-font-face="mercenary">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mercenary — Escape from Targ</title>
    <link rel="stylesheet" href="/src/shell/damoclesPanel.css" />
    <link rel="stylesheet" href="/src/shell/chrome.css" />
    <link rel="stylesheet" href="/src/shell/panelControls.css" />
    <style>
      :root {
        color-scheme: dark;
        --accent: #61c8ff;
        --border: #2d7697;
        --panel: #07151d;
        --status: #b7cad2;
        --text: #f4f7f8;
        --shell-font-family: 'Mercenary Pixel';
        --shell-font-size: 16px;
      }

      :root[data-font-face='damocles'] {
        --shell-font-family: 'Damocles Interface';
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
        background: #000;
      }

      body {
        display: grid;
        place-items: center;
        color: var(--text);
        font-family: var(--shell-font-family);
        font-size: var(--shell-font-size);
        font-style: normal;
        font-weight: 400;
        font-synthesis: none;
        line-height: 1.5;
      }

      main {
        width: 100%;
      }

      #game-surface {
        width: min(100%, 1280px);
        margin-inline: auto;
        overflow: hidden;
        background: var(--panel);
        border-block: 1px solid var(--border);
      }

      /* The world view and the Benson Panel are one authored frame, scaled together and
         letterboxed, rather than a view that fills the window with a gadget beneath it. */
      /* The frame is scaled to fit the window, so its height budget must exclude the shell's own
         edges: the two border lines above and below the Game Surface. */
      #frame-stack {
        display: grid;
        width: min(100%, calc((100dvh - 2px) * 1280 / 1056));
        margin-inline: auto;
        aspect-ratio: 1280 / 1056;
        grid-template-rows: 800fr 256fr;
      }

      /* The Damocles rendition keeps the ST panel's own proportions: 61 rows under a 320-column
         world at four page pixels a row, so it stands taller than the Targ strip. */
      #game-surface[data-rendition='damocles'] #frame-stack {
        width: min(100%, calc((100dvh - 2px) * 1280 / 1044));
        aspect-ratio: 1280 / 1044;
        grid-template-rows: 800fr 244fr;
      }

      #game-surface[data-composition='strip'] #frame-stack {
        width: min(100%, calc((100dvh - 2px) * 1280 / 800));
        aspect-ratio: 1280 / 800;
        grid-template-rows: 1fr;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #000;
      }

      #frame {
        touch-action: manipulation;
      }

      #frame[data-take-target] {
        cursor: pointer;
      }

      #comms,
      #status-row {
        display: flex;
        min-height: 2rem;
        align-items: center;
        padding: 8px 12px;
        border-top: 1px solid var(--border);
      }

      #comms {
        gap: 16px;
        color: var(--text);
      }

      #message {
        overflow: hidden;
        flex: 1;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #message[data-source='game'] {
        font-variant-ligatures: none;
        white-space: pre;
      }

      #message[data-benson-colour='2'],
      #panel-message[data-benson-colour='2'],
      #damocles-message[data-benson-colour='2'] {
        color: #ab3c65;
      }

      #message[data-benson-colour='5'],
      #panel-message[data-benson-colour='5'],
      #damocles-message[data-benson-colour='5'] {
        color: #5ed638;
      }

      #message[data-benson-colour='6'],
      #panel-message[data-benson-colour='6'],
      #damocles-message[data-benson-colour='6'] {
        color: #3a31ff;
      }

      #credits {
        flex: none;
        color: var(--accent);
      }

      #status-row {
        flex-wrap: wrap;
        gap: 8px 16px;
        min-height: 1.75rem;
        color: var(--status);
        white-space: normal;
      }

      #status {
        min-width: 0;
        flex: 1 1 20rem;
      }

      #typeface-control {
        display: flex;
        flex: none;
        align-items: center;
        gap: 8px;
        font-variant-ligatures: none;
        white-space: pre;
      }

      #typeface {
        max-width: 100%;
        padding: 4px 24px 4px 8px;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 0;
        font: inherit;
        font-synthesis: none;
      }

      #save-controls {
        display: flex;
        flex: none;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }

      #save-controls label {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      #save-controls select,
      #save-controls button {
        min-height: 2rem;
        padding: 4px 8px;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 0;
        font: inherit;
        font-synthesis: none;
      }

      #save-controls button:focus-visible,
      #save-controls select:focus-visible,
      #typeface:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      #save-controls button:disabled,
      #save-controls select:disabled {
        opacity: 0.55;
      }

      #failure {
        width: min(calc(100% - 2rem), 60rem);
        margin: 1rem auto 0;
        padding: 1rem;
        color: #ffd7d7;
        background: #2b0909;
        border: 1px solid #8e3030;
        white-space: pre-wrap;
      }

      [hidden] {
        display: none !important;
      }

      @media (min-width: 1282px) {
        #game-surface {
          border-inline: 1px solid var(--border);
        }
      }

      @media (max-width: 480px) {
        :root {
          --shell-font-size: 8px;
        }

        #status,
        #save-controls {
          flex: 1 1 100%;
          min-width: 0;
        }

        #save-controls label {
          min-width: 0;
          flex: 1 1 100%;
        }

        #save-controls select {
          width: 100%;
          min-width: 0;
        }

        #save-controls button {
          min-width: 0;
          flex: 1 1 0;
        }
      }

      #damocles-message.benson-cells {
        display: grid;
        box-sizing: border-box;
        grid-template-columns: repeat(23, 1ch);
        justify-content: center;
        letter-spacing: 0;
        white-space: pre;
        column-gap: 0.14em;
      }
      .benson-cell {
        min-width: 0;
        text-align: center;
      }

      /* ---------------------------------------------------------------------
         BENSON PANEL — authored instrument panel (ADR 0027). Tokens first:
         base values are the Targ rendition, [data-rendition='damocles']
         restyles them, and the canvases read them at draw time.
         ------------------------------------------------------------------ */
      #game-surface {
        --panel-face: #c2a878;
        --panel-face-dark: #a68c5c;
        --panel-hi: #eadfba;
        --panel-lo: #574424;
        --lcd-bg: #f4f4f4;
        --lcd-ink: #121212;
        --cell-border: #121212;
        --msg-bg: #efe6c6;
        --msg-ink: #121212;
        --label-ink: #3c2f16;
        --lamp-off: #2e2818;
        --lamp-on: #e8c33c;
        --altitude-lamp-on: #ed1c24;
        --gauge-sky: #7ab2dc;
        --gauge-ground: #74ac48;
        --gauge-face: #e8e8e8;
        --gauge-ink: #141414;
        --panel-font: 'Mercenary Pixel', 'Courier New', monospace;
      }

      #game-surface[data-rendition='damocles'] {
        --panel-face: #9aa0a0;
        --panel-face-dark: #7e8484;
        --panel-hi: #ced4d4;
        --panel-lo: #43484a;
        --lcd-bg: #060606;
        --lcd-ink: #3ecf3e;
        --cell-border: #9aa0a0;
        --msg-bg: #060606;
        --msg-ink: #3ecf3e;
        --label-ink: #2c3032;
        --lamp-off: #2c3032;
        --gauge-sky: #a9c6dc;
        --gauge-ground: #9dbd85;
        --gauge-face: #cfe4f2;
        --panel-font: 'Damocles Interface', 'Courier New', monospace;
        --nav-face: #86987e;
        --nav-lcd: #c9d8ba;
        --nav-ink: #1c2414;
        --inv-face: #8fb0c8;
        --inv-lcd: #cfe4f2;
        --inv-ink: #16303e;
        --clock-bg: #e8a685;
        --clock-ink: #301408;
      }

      /* Which Display Composition is shown. The panel is the default; the classic strip
         preserves the prior bare frame for anyone who wants the readouts. */
      #game-surface[data-composition='panel'] #status-row,
      #game-surface[data-composition='panel'] #comms {
        display: none;
      }
      #game-surface[data-composition='strip'] #benson-panel {
        display: none;
      }
      #game-surface[data-rendition='targ'] .rendition-damocles,
      #game-surface[data-rendition='damocles'] .rendition-targ {
        display: none !important;
      }

      #benson-panel {
        overflow: hidden;
        padding: 0;
        background: #101010;
        font-family: var(--panel-font);
        user-select: none;
      }

      /* One authored frame, scaled as a whole so the instruments keep their proportions at every
         width rather than reflowing into a different panel. The ratio is a number CSS cannot
         divide two lengths to reach, so the shell measures the panel and sets it. */
      #panel-scale {
        width: 1280px;
        transform-origin: top left;
        scale: var(--panel-scale, 1);
      }

      .instrument-canvas {
        image-rendering: pixelated;
      }
      #panel-targ {
        position: relative;
        height: 256px;
      }
      #targ-panel-canvas {
        width: 1280px;
        height: 256px;
        image-rendering: pixelated;
      }
      #targ-panel-readouts {
        position: absolute;
        top: 0;
        left: 0;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      /* ---------------------------------------------------------------------
         DEPARTURE — the carousel of Destinations over the deep-space frame
         (ADR 0040). Skip is page chrome anchored to the viewport, so its
         disappearance at the join changes nothing in the authored frame.
         ------------------------------------------------------------------ */
      #frame-stack {
        position: relative;
      }

      #departure {
        position: absolute;
        z-index: 1;
        inset: 0 0 auto;
        height: calc(800 / 1056 * 100%);
        color: var(--text);
        font-family: var(--panel-font);
        letter-spacing: 0.08em;
        pointer-events: none;
        text-transform: uppercase;
      }

      #game-surface[data-composition='strip'] #departure {
        height: 100%;
      }

      #departure[hidden] {
        display: none;
      }

      .departure-carousel {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      .departure-track {
        position: absolute;
        top: 50%;
        left: 0;
        display: grid;
        width: 100%;
        grid-auto-columns: 100%;
        grid-auto-flow: column;
        align-items: center;
        transform: translateY(-50%);
        will-change: transform;
      }

      .departure-destination {
        display: grid;
        justify-items: center;
        gap: 8px;
        text-align: center;
        text-shadow: 0 2px 0 #000;
      }

      .departure-kicker {
        color: var(--status);
        font-size: 12px;
      }

      .departure-name {
        margin: 0;
        color: var(--accent);
        font-size: clamp(28px, 6vw, 64px);
        font-weight: 400;
      }

      .departure-place {
        color: var(--text);
        font-size: clamp(12px, 2vw, 18px);
      }

      .departure-actions {
        position: absolute;
        right: 0;
        bottom: 12%;
        left: 0;
        display: flex;
        justify-content: center;
        pointer-events: auto;
      }

      #departure-commit {
        min-width: 112px;
      }

      /* Page chrome anchored to the viewport, not to the authored frame: it appears at commit
         and vanishes at the join without the frame's layout changing. */
      #departure-skip {
        position: fixed;
        z-index: 2;
        right: 16px;
        bottom: 16px;
      }

      #departure-skip[hidden] {
        display: none;
      }

      @media (max-width: 600px) {
        .departure-place {
          font-size: 8px;
          letter-spacing: 0.04em;
        }
      }
    </style>
  </head>
  <body>
    <main aria-label="Mercenary Browser Shell">
      <section id="game-surface" data-state="loading" aria-label="Game Surface">
        <div id="frame-stack">
          <canvas
            id="frame"
            width="1280"
            height="800"
            aria-label="Wireframe view of Targ. Tap or click a nearby object to take it."
          ></canvas>
          <section
            id="departure"
            data-shell-chrome
            aria-label="Departure"
            hidden
          >
            <div class="departure-carousel">
              <div id="departure-track" class="departure-track"></div>
            </div>
            <div class="departure-actions">
              <button
                id="departure-commit"
                class="chrome-button"
                type="button"
                aria-label="Commit Destination"
              >
                COMMIT
              </button>
            </div>
          </section>
          <div id="benson-panel" aria-label="Benson Panel">
            <div id="panel-scale">
              <section
                id="panel-targ"
                class="rendition-targ"
                aria-label="Benson G9-ST"
              >
                <canvas
                  id="targ-panel-canvas"
                  width="320"
                  height="64"
                  aria-hidden="true"
                ></canvas>
                <div id="targ-panel-readouts">
                  BENSON G9-ST. Location
                  <span data-field="locationLabel"></span>. Altitude
                  <span data-field="altitude"></span>. Speed
                  <span data-field="speed"></span>. Elevation
                  <span data-field="elevationDegrees"></span> degrees. Compass
                  <span data-field="compassDegrees"></span> degrees. Ground
                  warning
                  <span data-field="groundLamp" data-lamp="groundLamp"></span>.
                  Aboard
                  <span
                    data-field="altitudeLamp"
                    data-lamp="altitudeLamp"
                  ></span
                  >. Running
                  <span data-field="runLamp" data-lamp="runLamp"></span>. Benson
                  <span id="panel-message" data-field="message"></span>.
                </div>
              </section>

              <damocles-panel
                id="panel-damocles"
                class="rendition-damocles"
              ></damocles-panel>
            </div>
          </div>
        </div>
        <div
          id="comms"
          role="group"
          aria-label="Communications"
          aria-live="off"
        >
          <span id="message">Loading the Data Payload…</span>
          <span id="credits"></span>
        </div>
        <div id="status-row">
          <div id="status">STARTING SESSION</div>
        </div>
        <button
          id="departure-skip"
          class="chrome-button"
          type="button"
          data-shell-chrome
          aria-label="Skip to Targ"
          hidden
        >
          SKIP
        </button>
      </section>
      <p id="failure" role="alert" hidden></p>
    </main>
    <!-- The one package the browser imports by name: its own ES modules, served from disk. -->
    <script type="importmap">
      { "imports": { "@northtalk/ts": "/node_modules/@northtalk/ts/index.js" } }
    </script>
    <script type="module" src="/src/shell/boot.ts"></script>
  </body>
</html>
