<!doctype html>
<html lang="en" data-font-face="mercenary">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mercenary — Escape from Targ</title>
    <style>
      :root {
        color-scheme: dark;
        --accent: #61c8ff;
        --border: #2d7697;
        --panel: #07151d;
        --status: #b7cad2;
        --text: #f4f7f8;
        --shell-font-family: 'Mercenary Pixel';
        --shell-font-size: 16px;
      }

      :root[data-font-face='damocles'] {
        --shell-font-family: 'Damocles Interface';
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
        background: #000;
      }

      body {
        display: grid;
        place-items: center;
        color: var(--text);
        font-family: var(--shell-font-family);
        font-size: var(--shell-font-size);
        font-style: normal;
        font-weight: 400;
        font-synthesis: none;
        line-height: 1.5;
      }

      main {
        width: 100%;
      }

      #game-surface {
        width: min(100%, 1280px);
        margin-inline: auto;
        overflow: hidden;
        background: var(--panel);
        border-block: 1px solid var(--border);
      }

      /* The world view and the Benson Panel are one authored frame, scaled together and
         letterboxed, rather than a view that fills the window with a gadget beneath it. */
      #frame-stack {
        display: grid;
        width: min(100%, calc(100dvh * 1280 / 1100));
        margin-inline: auto;
        aspect-ratio: 1280 / 1100;
        grid-template-rows: 800fr 300fr;
      }

      #game-surface[data-composition='strip'] #frame-stack {
        width: min(100%, calc(100dvh * 1280 / 800));
        aspect-ratio: 1280 / 800;
        grid-template-rows: 1fr;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #000;
      }

      #comms,
      #status-row {
        display: flex;
        min-height: 2rem;
        align-items: center;
        padding: 8px 12px;
        border-top: 1px solid var(--border);
      }

      #comms {
        gap: 16px;
        color: var(--text);
      }

      #message {
        overflow: hidden;
        flex: 1;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #credits {
        flex: none;
        color: var(--accent);
      }

      #status-row {
        flex-wrap: wrap;
        gap: 8px 16px;
        min-height: 1.75rem;
        color: var(--status);
        white-space: normal;
      }

      #status {
        min-width: 0;
        flex: 1 1 20rem;
      }

      #typeface-control {
        display: flex;
        flex: none;
        align-items: center;
        gap: 8px;
        white-space: nowrap;
      }

      #typeface {
        max-width: 100%;
        padding: 4px 24px 4px 8px;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 0;
        font: inherit;
        font-synthesis: none;
      }

      #save-controls {
        display: flex;
        flex: none;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }

      #save-controls label {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      #save-controls select,
      #save-controls button {
        min-height: 2rem;
        padding: 4px 8px;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 0;
        font: inherit;
        font-synthesis: none;
      }

      #save-controls button:focus-visible,
      #save-controls select:focus-visible,
      #typeface:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      #save-controls button:disabled,
      #save-controls select:disabled {
        opacity: 0.55;
      }

      #failure {
        width: min(calc(100% - 2rem), 60rem);
        margin: 1rem auto 0;
        padding: 1rem;
        color: #ffd7d7;
        background: #2b0909;
        border: 1px solid #8e3030;
        white-space: pre-wrap;
      }

      [hidden] {
        display: none !important;
      }

      @media (min-width: 1282px) {
        #game-surface {
          border-inline: 1px solid var(--border);
        }
      }

      @media (max-width: 480px) {
        :root {
          --shell-font-size: 8px;
        }

        #status,
        #save-controls {
          flex: 1 1 100%;
          min-width: 0;
        }

        #save-controls label {
          min-width: 0;
          flex: 1 1 100%;
        }

        #save-controls select {
          width: 100%;
          min-width: 0;
        }

        #save-controls button {
          min-width: 0;
          flex: 1 1 0;
        }
      }

      /* ---------------------------------------------------------------------
         BENSON PANEL — authored instrument panel (ADR 0027). Tokens first:
         base values are the Targ rendition, [data-rendition='damocles']
         restyles them, and the canvases read them at draw time.
         ------------------------------------------------------------------ */
      #game-surface {
        --panel-face: #c2a878;
        --panel-face-dark: #a68c5c;
        --panel-hi: #eadfba;
        --panel-lo: #574424;
        --lcd-bg: #0c0c0c;
        --lcd-ink: #f4f4f4;
        --cell-border: #e6e6e6;
        --msg-bg: #efe6c6;
        --msg-ink: #121212;
        --label-ink: #3c2f16;
        --lamp-off: #2e2818;
        --lamp-on: #e8c33c;
        --gauge-sky: #7ab2dc;
        --gauge-ground: #74ac48;
        --gauge-face: #e8e8e8;
        --gauge-ink: #141414;
        --panel-font: 'Mercenary Pixel', 'Courier New', monospace;
      }

      #game-surface[data-rendition='damocles'] {
        --panel-face: #9aa0a0;
        --panel-face-dark: #7e8484;
        --panel-hi: #ced4d4;
        --panel-lo: #43484a;
        --lcd-bg: #060606;
        --lcd-ink: #3ecf3e;
        --cell-border: #9aa0a0;
        --msg-bg: #060606;
        --msg-ink: #3ecf3e;
        --label-ink: #2c3032;
        --lamp-off: #2c3032;
        --gauge-sky: #a9c6dc;
        --gauge-ground: #9dbd85;
        --gauge-face: #cfe4f2;
        --panel-font: 'Damocles Interface', 'Courier New', monospace;
        --nav-face: #86987e;
        --nav-lcd: #c9d8ba;
        --nav-ink: #1c2414;
        --inv-face: #8fb0c8;
        --inv-lcd: #cfe4f2;
        --inv-ink: #16303e;
        --clock-bg: #e8a685;
        --clock-ink: #301408;
      }

      /* Which Display Composition is shown. The panel is the default; the classic strip
         preserves the prior bare frame for anyone who wants the readouts. */
      #game-surface[data-composition='panel'] #status-row,
      #game-surface[data-composition='panel'] #comms {
        display: none;
      }
      #game-surface[data-composition='strip'] #benson-panel {
        display: none;
      }
      #game-surface[data-rendition='targ'] .rendition-damocles,
      #game-surface[data-rendition='damocles'] .rendition-targ {
        display: none !important;
      }

      #benson-panel {
        overflow: hidden;
        padding: 0;
        background: #101010;
        font-family: var(--panel-font);
        user-select: none;
      }

      /* One authored frame, scaled as a whole so the instruments keep their proportions at every
         width rather than reflowing into a different panel. The ratio is a number CSS cannot
         divide two lengths to reach, so the shell measures the panel and sets it. */
      #panel-scale {
        width: 1280px;
        transform-origin: top left;
        scale: var(--panel-scale, 1);
      }

      .bezel {
        background: var(--panel-face);
        border-radius: 12px;
        box-shadow:
          inset 4px 4px 0 var(--panel-hi),
          inset -4px -4px 0 var(--panel-lo);
      }

      .inset {
        background: var(--panel-face-dark);
        border-radius: 10px;
        box-shadow:
          inset 4px 4px 0 var(--panel-lo),
          inset -4px -4px 0 var(--panel-hi);
      }

      .lcd {
        display: flex;
        gap: 4px;
        align-items: center;
        justify-content: center;
        padding: 6px 8px;
        background: var(--lcd-bg);
        border-radius: 6px;
        color: var(--lcd-ink);
        font-size: 26px;
        letter-spacing: 0.16em;
      }

      .lamp {
        width: 24px;
        height: 24px;
        background: var(--lamp-off);
        border-radius: 4px;
        box-shadow: inset 2px 2px 0 rgb(0 0 0 / 60%);
      }

      .lamp.on {
        background: var(--lamp-on);
        box-shadow: 0 0 8px var(--lamp-on);
      }

      .plabel {
        color: var(--label-ink);
        font-size: 18px;
        letter-spacing: 0.08em;
        text-align: center;
        white-space: nowrap;
      }

      .instrument-canvas {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }

      /* --- Targ rendition ------------------------------------------------- */
      #panel-targ {
        display: grid;
        height: 300px;
        padding: 16px 20px 20px;
        gap: 16px;
        grid-template-columns: 168px 1fr 224px;
      }

      #panel-targ .column {
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
        padding: 12px;
      }

      #targ-elevation {
        width: 84px;
        height: 184px;
        overflow: hidden;
        border-radius: 6px;
      }

      #panel-targ .instruments {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(3, 1fr);
      }

      #panel-targ .instrument {
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: center;
        padding: 12px;
      }

      #panel-targ .instrument .row {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      #panel-targ .middle {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      #panel-message {
        overflow: hidden;
        padding: 10px 8px 6px;
        margin-inline: 12px;
        background: var(--msg-bg);
        border-radius: 6px;
        color: var(--msg-ink);
        font-size: 30px;
        letter-spacing: 0.1em;
        text-align: center;
        white-space: nowrap;
      }

      #targ-compass-slot {
        width: 168px;
        height: 24px;
        margin-bottom: 16px;
      }

      #targ-compass {
        width: 184px;
        height: 88px;
        overflow: hidden;
        border-radius: 6px;
      }

      /* --- Damocles rendition --------------------------------------------- */
      #panel-damocles {
        display: grid;
        height: 300px;
        padding: 12px 16px 16px;
        gap: 10px;
        grid-template-rows: 56px 1fr;
      }

      #damocles-message-bar {
        padding: 6px;
      }

      #damocles-message {
        display: flex;
        height: 100%;
        overflow: hidden;
        align-items: center;
        justify-content: center;
        background: var(--msg-bg);
        border-radius: 4px;
        color: var(--msg-ink);
        font-size: 26px;
        letter-spacing: 0.14em;
        text-shadow: 2px 0 0 currentcolor;
        white-space: nowrap;
      }

      #damocles-body {
        display: grid;
        gap: 12px;
        grid-template-columns: 24px 496px 1fr 400px 24px;
      }

      .tp-gauge {
        position: relative;
        border-radius: 6px;
      }

      .tp-gauge .fill {
        position: absolute;
        right: 6px;
        bottom: 6px;
        left: 6px;
        background: #d8d8d8;
        border-radius: 2px;
      }

      .tp-gauge .tp-label {
        position: absolute;
        right: 0;
        bottom: -2px;
        left: 0;
        color: var(--label-ink);
        font-size: 16px;
        text-align: center;
      }

      #damocles-nav {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 12px;
        background: var(--nav-face);
        border-radius: 10px;
        box-shadow:
          inset 4px 4px 0 var(--panel-hi),
          inset -4px -4px 0 var(--panel-lo);
      }

      #damocles-nav > .nav-row {
        flex: 1;
      }

      #damocles-nav .nav-lower {
        display: flex;
        flex: 2;
        gap: 10px;
      }

      .nav-lcd {
        display: flex;
        overflow: hidden;
        align-items: center;
        justify-content: center;
        padding: 4px 6px;
        background: var(--nav-lcd);
        border: 4px solid #3f463c;
        border-radius: 8px;
        color: var(--nav-ink);
        font-size: 20px;
        text-shadow: 2px 0 0 currentcolor;
        white-space: nowrap;
      }

      #damocles-nav .nav-row {
        display: flex;
        gap: 10px;
      }

      #damocles-nav .nav-row > .nav-lcd {
        flex: 1;
      }

      #damocles-elevation {
        width: 56px;
        overflow: hidden;
        align-self: stretch;
        border: 4px solid #3f463c;
        border-radius: 8px;
        flex: none;
      }

      #damocles-nav .nav-stack {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 12px;
      }

      #damocles-nav .nav-foot {
        display: flex;
        flex: 1;
        align-items: center;
        justify-content: space-between;
      }

      #damocles-nav .nav-foot .plabel {
        font-size: 20px;
        letter-spacing: 0.12em;
        text-shadow: 2px 0 0 currentcolor;
      }

      #damocles-compass {
        width: 152px;
        height: 36px;
        overflow: hidden;
        border: 4px solid #3f463c;
        border-radius: 8px;
      }

      #damocles-aux {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #060606;
        border-radius: 8px;
        box-shadow:
          inset 4px 4px 0 var(--panel-lo),
          inset -4px -4px 0 var(--panel-hi);
      }

      #damocles-aux .aux-title {
        color: #b8bec2;
        font-size: 44px;
        letter-spacing: 0.06em;
        text-shadow: 4px 4px 0 #3a4046;
      }

      #damocles-right {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      #damocles-inventory {
        display: grid;
        flex: 1;
        gap: 10px;
        padding: 12px;
        background: var(--inv-face);
        border-radius: 10px;
        box-shadow:
          inset 4px 4px 0 var(--panel-hi),
          inset -4px -4px 0 var(--panel-lo);
        grid-template-columns: 20px 1fr;
      }

      #inventory-capacity {
        position: relative;
        background: var(--inv-lcd);
        border: 2px solid var(--panel-lo);
        border-radius: 4px;
      }

      #inventory-capacity .fill {
        position: absolute;
        right: 2px;
        bottom: 2px;
        left: 2px;
        background: var(--inv-ink);
      }

      #damocles-inventory .inventory-stack {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      #inventory-window {
        display: flex;
        flex: 1;
        align-items: center;
        justify-content: center;
        background: var(--inv-lcd);
        border: 2px solid var(--panel-lo);
        border-radius: 4px;
        color: var(--inv-ink);
        font-size: 26px;
        letter-spacing: 0.12em;
        text-shadow: 2px 0 0 currentcolor;
      }

      #damocles-inventory .inventory-foot {
        display: flex;
        overflow: hidden;
        gap: 10px;
        align-items: center;
      }

      #inventory-cash {
        padding: 4px 8px;
        background: var(--inv-lcd);
        border: 2px solid var(--panel-lo);
        border-radius: 4px;
        color: var(--inv-ink);
        font-size: 20px;
        text-shadow: 2px 0 0 currentcolor;
        white-space: nowrap;
      }

      #damocles-inventory .inventory-foot .plabel {
        color: var(--inv-lcd);
        font-size: 16px;
        letter-spacing: 0.06em;
      }

      #damocles-foot {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: flex-end;
      }

      #damocles-clock {
        padding: 6px 16px 4px;
        background: var(--clock-bg);
        border-radius: 6px;
        color: var(--clock-ink);
        font-size: 30px;
        letter-spacing: 0.1em;
        text-shadow: 2px 0 0 currentcolor;
      }
    </style>
  </head>
  <body>
    <main aria-label="Mercenary Browser Shell">
      <section id="game-surface" data-state="loading" aria-label="Game Surface">
        <div id="frame-stack">
          <canvas
            id="frame"
            width="1280"
            height="800"
            aria-label="Wireframe view of Targ"
          ></canvas>
          <div id="benson-panel" aria-label="Benson Panel">
            <div id="panel-scale">
              <section id="panel-targ" class="rendition-targ bezel">
                <div class="column bezel">
                  <div id="targ-elevation">
                    <canvas
                      id="targ-elevation-canvas"
                      class="instrument-canvas"
                      width="84"
                      height="184"
                    ></canvas>
                  </div>
                  <div class="plabel">ELEVATION</div>
                </div>

                <div class="middle">
                  <div class="instruments">
                    <div class="instrument bezel">
                      <div class="row">
                        <span class="lamp" data-lamp="groundLamp"></span>
                        <span class="lcd" data-field="locationLabel"></span>
                      </div>
                      <div class="plabel">LOCATION</div>
                    </div>
                    <div class="instrument bezel">
                      <div class="row">
                        <span class="lamp" data-lamp="runLamp"></span>
                        <span class="lcd" data-field="altitude"></span>
                      </div>
                      <div class="plabel">ALTITUDE</div>
                    </div>
                    <div class="instrument bezel">
                      <div class="row">
                        <span class="lamp" data-lamp="attackLamp"></span>
                        <span class="lcd" data-field="speed"></span>
                      </div>
                      <div class="plabel">SPEED</div>
                    </div>
                  </div>
                  <div id="panel-message" data-field="message"></div>
                  <div class="plabel">BENSON G9-ST</div>
                </div>

                <div class="column bezel">
                  <div id="targ-compass-slot" class="inset"></div>
                  <div id="targ-compass">
                    <canvas
                      id="targ-compass-canvas"
                      class="instrument-canvas"
                      width="184"
                      height="88"
                    ></canvas>
                  </div>
                  <div class="plabel">COMPASS</div>
                </div>
              </section>

              <section id="panel-damocles" class="rendition-damocles bezel">
                <div id="damocles-message-bar" class="inset">
                  <div id="damocles-message" data-field="message"></div>
                </div>
                <div id="damocles-body">
                  <div class="tp-gauge inset">
                    <div class="fill" style="height: 34%"></div>
                    <div class="tp-label">T</div>
                  </div>

                  <div id="damocles-nav">
                    <div class="nav-row">
                      <div class="nav-lcd" data-field="locationName"></div>
                      <div class="nav-lcd" data-field="speedLabel"></div>
                    </div>
                    <div class="nav-lower">
                      <div id="damocles-elevation">
                        <canvas
                          id="damocles-elevation-canvas"
                          class="instrument-canvas"
                          width="56"
                          height="112"
                        ></canvas>
                      </div>
                      <div class="nav-stack">
                        <div class="nav-row">
                          <div class="nav-lcd" data-field="locationLabel"></div>
                          <div class="nav-lcd" data-field="altitude"></div>
                          <div class="nav-lcd" data-field="heading"></div>
                        </div>
                        <div class="nav-foot">
                          <div class="plabel">NAVIGATION</div>
                          <div id="damocles-compass">
                            <canvas
                              id="damocles-compass-canvas"
                              class="instrument-canvas"
                              width="152"
                              height="36"
                            ></canvas>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div id="damocles-aux">
                    <span class="aux-title">TARG</span>
                  </div>

                  <div id="damocles-right">
                    <div id="damocles-inventory">
                      <div id="inventory-capacity">
                        <div class="fill" style="height: 4%"></div>
                      </div>
                      <div class="inventory-stack">
                        <div id="inventory-window" data-field="inventory"></div>
                        <div class="inventory-foot">
                          <span id="inventory-cash" data-field="cash"></span>
                          <span class="plabel">INVENTORY</span>
                        </div>
                      </div>
                    </div>
                    <div id="damocles-foot">
                      <span class="lamp" data-lamp="groundLamp"></span>
                      <span class="lamp" data-lamp="attackLamp"></span>
                      <span class="lamp" data-lamp="runLamp"></span>
                      <span id="damocles-clock" data-field="clock"></span>
                    </div>
                  </div>

                  <div class="tp-gauge inset">
                    <div class="fill" style="height: 52%"></div>
                    <div class="tp-label">P</div>
                  </div>
                </div>
              </section>
            </div>
          </div>
        </div>
        <div
          id="comms"
          role="group"
          aria-label="Communications"
          aria-live="off"
        >
          <span id="message">Loading the Data Payload…</span>
          <span id="credits"></span>
        </div>
        <div id="status-row">
          <div id="status">STARTING SESSION</div>
          <div
            id="save-controls"
            data-shell-chrome
            role="group"
            aria-label="Saved sessions"
          >
            <label for="save-slot">
              <span>SAVE</span>
              <select id="save-slot" aria-label="Save slot">
                <option value="1">SLOT 1 — EMPTY</option>
                <option value="2">SLOT 2 — EMPTY</option>
                <option value="3">SLOT 3 — EMPTY</option>
              </select>
            </label>
            <button id="save-session" type="button">SAVE</button>
            <button id="load-session" type="button">LOAD</button>
            <button id="delete-save" type="button">DELETE</button>
          </div>
          <label id="typeface-control" data-shell-chrome for="typeface">
            <span>TYPEFACE</span>
            <select id="typeface" disabled>
              <option value="mercenary">MERCENARY</option>
              <option value="damocles">DAMOCLES</option>
            </select>
          </label>
        </div>
      </section>
      <p id="failure" role="alert" hidden></p>
    </main>
    <script type="module" src="/src/shell/boot.ts"></script>
  </body>
</html>
