<!doctype html>
<html lang="en" data-font-face="mercenary">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mercenary — Escape from Targ</title>
    <style>
      :root {
        color-scheme: dark;
        --accent: #61c8ff;
        --border: #2d7697;
        --panel: #07151d;
        --status: #b7cad2;
        --text: #f4f7f8;
        --shell-font-family: 'Mercenary Pixel';
        --shell-font-size: 16px;
      }

      :root[data-font-face='damocles'] {
        --shell-font-family: 'Damocles Interface';
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
        background: #000;
      }

      body {
        display: grid;
        place-items: center;
        color: var(--text);
        font-family: var(--shell-font-family);
        font-size: var(--shell-font-size);
        font-style: normal;
        font-weight: 400;
        font-synthesis: none;
        line-height: 1.5;
      }

      main {
        width: 100%;
      }

      #game-surface {
        width: min(100%, 1280px);
        margin-inline: auto;
        overflow: hidden;
        background: var(--panel);
        border-block: 1px solid var(--border);
      }

      canvas {
        display: block;
        width: 100%;
        aspect-ratio: 1280 / 800;
        background: #000;
      }

      #comms,
      #status-row {
        display: flex;
        min-height: 2rem;
        align-items: center;
        padding: 8px 12px;
        border-top: 1px solid var(--border);
      }

      #comms {
        gap: 16px;
        color: var(--text);
      }

      #message {
        overflow: hidden;
        flex: 1;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #credits {
        flex: none;
        color: var(--accent);
      }

      #status-row {
        flex-wrap: wrap;
        gap: 8px 16px;
        min-height: 1.75rem;
        color: var(--status);
        white-space: normal;
      }

      #status {
        min-width: 0;
        flex: 1 1 20rem;
      }

      #typeface-control {
        display: flex;
        flex: none;
        align-items: center;
        gap: 8px;
        white-space: nowrap;
      }

      #typeface {
        max-width: 100%;
        padding: 4px 24px 4px 8px;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 0;
        font: inherit;
        font-synthesis: none;
      }

      #failure {
        width: min(calc(100% - 2rem), 60rem);
        margin: 1rem auto 0;
        padding: 1rem;
        color: #ffd7d7;
        background: #2b0909;
        border: 1px solid #8e3030;
        white-space: pre-wrap;
      }

      [hidden] {
        display: none !important;
      }

      @media (min-width: 1282px) {
        #game-surface {
          border-inline: 1px solid var(--border);
        }
      }

      @media (max-width: 480px) {
        :root {
          --shell-font-size: 8px;
        }
      }
    </style>
  </head>
  <body>
    <main aria-label="Mercenary Browser Shell">
      <section id="game-surface" data-state="loading" aria-label="Game Surface">
        <canvas
          id="frame"
          width="1280"
          height="800"
          aria-label="Wireframe view of Targ"
        ></canvas>
        <div id="comms" aria-label="Communications" aria-live="off">
          <span id="message">Loading the Data Payload…</span>
          <span id="credits"></span>
        </div>
        <div id="status-row">
          <div id="status">STARTING SESSION</div>
          <label id="typeface-control" for="typeface">
            <span>TYPEFACE</span>
            <select id="typeface" disabled>
              <option value="mercenary">MERCENARY</option>
              <option value="damocles">DAMOCLES</option>
            </select>
          </label>
        </div>
      </section>
      <p id="failure" role="alert" hidden></p>
    </main>
    <script type="module" src="/src/shell/boot.ts"></script>
  </body>
</html>
