<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mercenary · Flyover</title>
    <link rel="stylesheet" href="/src/shell/damoclesPanel.css" />
    <style>
      @font-face {
        font-family: 'Damocles Interface';
        src: url('/payload/fonts/damocles.woff2') format('woff2');
        font-display: swap;
      }

      :root {
        color-scheme: dark;
        --accent: #61c8ff;
        --border: #2d7697;
        --panel: #07151d;
        --text: #f4f7f8;
        --muted: #b7cad2;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      body {
        color: var(--text);
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      main {
        position: relative;
        width: 100%;
        height: 100%;
      }

      h1 {
        position: absolute;
        z-index: 1;
        top: 1rem;
        left: 1rem;
        margin: 0;
        color: var(--accent);
        font-size: 0.75rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-shadow: 0 1px 3px #000;
      }

      p {
        position: absolute;
        z-index: 2;
        top: 3rem;
        left: 1rem;
        max-width: min(32rem, calc(100% - 2rem));
        margin: 0;
        padding: 0.75rem 1rem;
        color: var(--muted);
        background: color-mix(in srgb, var(--panel) 92%, transparent);
        border-left: 3px solid var(--border);
        line-height: 1.6;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }

      #flyover-dashboard {
        position: absolute;
        z-index: 1;
        right: 0;
        bottom: 0;
        left: 0;
        width: min(100%, 1280px);
        margin-inline: auto;
        aspect-ratio: 1280 / 244;
        overflow: hidden;
        background: #101010;
        pointer-events: none;
      }

      #flyover-panel-scale {
        width: 1280px;
        transform-origin: top left;
        scale: var(--panel-scale, 1);
      }

      /* The Flyover's readouts are longer than the ST panel's, so its navigation block grows to
         hold them at the face's own advance rather than in the narrowed dressing. */
      #flyover-dashboard damocles-panel #damocles-body {
        grid-template-columns: 1fr;
        justify-items: center;
      }

      #flyover-dashboard damocles-panel #damocles-nav,
      #flyover-dashboard damocles-panel .nav-stack,
      #flyover-dashboard damocles-panel .nav-lcd {
        width: auto;
      }

      #flyover-dashboard damocles-panel .nav-lcd {
        padding-right: calc(2 * var(--u));
      }

      #flyover-dashboard damocles-panel .nav-lcd .compact {
        letter-spacing: 0;
        transform: none;
        word-spacing: 0;
      }

      #flyover-dashboard damocles-panel .tp-gauge,
      #flyover-dashboard damocles-panel #damocles-aux,
      #flyover-dashboard damocles-panel #damocles-right {
        display: none;
      }

      #flyover-targ-panel {
        position: relative;
        height: 256px;
      }

      #flyover-targ-panel-canvas {
        width: 1280px;
        height: 256px;
        image-rendering: pixelated;
      }

      #flyover-targ-readouts {
        position: absolute;
        top: 0;
        left: 0;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      /* The surface frame lies over the Globe, at the Range Handoff's weight (ADR 0094). */
      #flyover-surface {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Targ's panel is 1280 by 256, taller than the Damocles panel's 244. */
      html[data-system='targ'] #flyover-dashboard {
        aspect-ratio: 1280 / 256;
      }

      /* Above the panel, outside it: values no panel has room for. */
      #flyover-inspection {
        position: absolute;
        z-index: 1;
        top: auto;
        max-width: none;
        border-left: 0;
        line-height: 1.4;
        bottom: calc(min(100vw, 1280px) / 5 + 6px);
        left: 1rem;
        margin: 0;
        padding: 2px 6px;
        background: rgb(0 0 0 / 60%);
        font-family: ui-monospace, monospace;
        font-size: 13px;
        color: #c8d8e8;
        white-space: pre;
      }

      /* The System Menu (#188): over the paused Flyover, above the panel. */
      #flyover-menu {
        position: absolute;
        z-index: 2;
        top: 50%;
        left: 50%;
        width: min(36rem, calc(100% - 2rem));
        max-height: calc(100% - 2rem);
        overflow-y: auto;
        padding: 1rem 1.25rem;
        transform: translate(-50%, -50%);
        background: color-mix(in srgb, var(--panel) 94%, transparent);
        border: 1px solid var(--border);
        text-transform: uppercase;
      }

      #flyover-menu h2 {
        margin: 0 0 0.75rem;
        color: var(--accent);
        font-size: 0.85rem;
        letter-spacing: 0.08em;
      }

      #flyover-menu button {
        margin: 0.15rem 0.35rem 0.15rem 0;
        padding: 0.3rem 0.6rem;
        color: var(--muted);
        background: transparent;
        border: 1px solid var(--border);
        font: inherit;
        font-size: 0.75rem;
        cursor: pointer;
      }

      #flyover-menu button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      #flyover-menu button[aria-pressed='true'] {
        color: #000;
        background: var(--accent);
      }

      #menu-actions {
        margin-bottom: 0.75rem;
      }

      .menu-row {
        margin-top: 0.5rem;
      }

      .menu-row > span {
        display: block;
        margin-bottom: 0.2rem;
        color: var(--text);
        font-size: 0.7rem;
        letter-spacing: 0.06em;
      }

      /* The Shell Console (#188), drawn as the game pages draw theirs. */
      #console {
        position: absolute;
        z-index: 3;
        top: 0;
        right: 0;
        left: 0;
        display: flex;
        height: 55%;
        flex-direction: column;
        padding: 8px 12px;
        background: rgb(10 12 10 / 92%);
        border-bottom: 2px solid #46d846;
        color: #46d846;
        font-family: ui-monospace, monospace;
        font-size: 14px;
        text-transform: uppercase;
        transform: translateY(-101%);
        transition: transform 0.15s ease-out;
      }

      main[data-console='open'] #console {
        transform: translateY(0);
      }

      @media (prefers-reduced-motion: reduce) {
        #console {
          transition: none;
        }
      }

      #console-log {
        overflow-y: auto;
        flex: 1;
        line-height: 1.5;
        white-space: pre-wrap;
      }

      #console-input-row {
        display: flex;
        gap: 8px;
        align-items: baseline;
      }

      #console-input {
        flex: 1;
        background: transparent;
        border: none;
        color: inherit;
        font: inherit;
        letter-spacing: 0.06em;
        outline: none;
        text-transform: uppercase;
      }

      [hidden] {
        display: none;
      }

      [role='alert'] {
        color: #ffd7d7;
        border-left: 3px solid #c85e5e;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Flyover</h1>
      <canvas id="flyover" role="img" aria-label="Orbital Flyover view" hidden>
        Your browser cannot display the Orbital Flyover canvas.
      </canvas>
      <canvas id="flyover-surface" aria-hidden="true" hidden></canvas>
      <p id="flyover-inspection" hidden></p>
      <section
        id="flyover-dashboard"
        role="region"
        aria-label="Flyover navigation dashboard"
        hidden
      >
        <div id="flyover-panel-scale">
          <damocles-panel id="panel-damocles"></damocles-panel>
          <div
            id="flyover-targ-panel"
            role="group"
            aria-label="Benson G9-ST"
            hidden
          >
            <canvas
              id="flyover-targ-panel-canvas"
              width="320"
              height="64"
              aria-hidden="true"
            ></canvas>
            <div id="flyover-targ-readouts">
              BENSON G9-ST. Location
              <span data-field="locationLabel"></span>. Altitude
              <span data-field="altitude"></span>. Speed
              <span data-field="speed"></span>.
              <span data-field="message"></span>.
            </div>
          </div>
        </div>
      </section>
      <section
        id="flyover-menu"
        role="dialog"
        aria-label="System Menu"
        aria-modal="false"
        hidden
      >
        <h2>Flyover · Paused</h2>
        <div id="menu-actions">
          <button id="menu-resume" type="button">Resume</button>
          <button id="menu-leave" type="button">Leave Flyover</button>
        </div>
        <div id="menu-rows"></div>
      </section>
      <div id="console" aria-label="Shell Console">
        <div id="console-log" role="log" aria-live="polite"></div>
        <div id="console-input-row">
          <span aria-hidden="true">]</span>
          <input
            id="console-input"
            type="text"
            aria-label="console command"
            autocapitalize="characters"
            autocomplete="off"
            spellcheck="false"
          />
        </div>
      </div>
      <p id="status" role="status">Loading System presentation document…</p>
      <p id="notice" role="status" hidden></p>
      <p id="failure" role="alert" hidden></p>
    </main>
    <script type="module" src="/src/flyover/boot.ts"></script>
  </body>
</html>
