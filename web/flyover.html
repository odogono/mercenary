<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mercenary · Flyover</title>
    <style>
      :root {
        color-scheme: dark;
        --accent: #61c8ff;
        --border: #2d7697;
        --panel: #07151d;
        --text: #f4f7f8;
        --muted: #b7cad2;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
        background: #000;
      }

      body {
        display: grid;
        place-items: center;
        padding: 1rem;
        color: var(--text);
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      main {
        width: min(100%, 44rem);
        padding: 1.5rem;
        background: var(--panel);
        border: 1px solid var(--border);
      }

      h1 {
        margin: 0 0 0.75rem;
        color: var(--accent);
        font-size: clamp(1.5rem, 5vw, 2.25rem);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      [role='alert'] {
        padding-left: 1rem;
        color: #ffd7d7;
        border-left: 3px solid #c85e5e;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Flyover</h1>
      <p id="status" role="status">Loading System presentation document…</p>
      <p id="failure" role="alert" hidden></p>
    </main>
    <script type="module" src="/src/flyover/boot.ts"></script>
  </body>
</html>
