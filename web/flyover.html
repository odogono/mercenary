<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mercenary · Flyover</title>
    <link rel="stylesheet" href="/src/shell/damoclesPanel.css" />
    <style>
      @font-face {
        font-family: 'Damocles Interface';
        src: url('/payload/fonts/damocles.woff2') format('woff2');
        font-display: swap;
      }

      :root {
        color-scheme: dark;
        --accent: #61c8ff;
        --border: #2d7697;
        --panel: #07151d;
        --text: #f4f7f8;
        --muted: #b7cad2;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      body {
        color: var(--text);
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      main {
        position: relative;
        width: 100%;
        height: 100%;
      }

      h1 {
        position: absolute;
        z-index: 1;
        top: 1rem;
        left: 1rem;
        margin: 0;
        color: var(--accent);
        font-size: 0.75rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-shadow: 0 1px 3px #000;
      }

      p {
        position: absolute;
        z-index: 2;
        top: 3rem;
        left: 1rem;
        max-width: min(32rem, calc(100% - 2rem));
        margin: 0;
        padding: 0.75rem 1rem;
        color: var(--muted);
        background: color-mix(in srgb, var(--panel) 92%, transparent);
        border-left: 3px solid var(--border);
        line-height: 1.6;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }

      #flyover-dashboard {
        position: absolute;
        z-index: 1;
        right: 0;
        bottom: 0;
        left: 0;
        width: min(100%, 1280px);
        margin-inline: auto;
        aspect-ratio: 1280 / 170;
        overflow: hidden;
        background: #101010;
        pointer-events: none;
      }

      #flyover-panel-scale {
        width: 1280px;
        transform-origin: top left;
        scale: var(--panel-scale, 1);
      }

      #flyover-dashboard damocles-panel #damocles-body {
        grid-template-columns: 1fr;
      }

      #flyover-dashboard damocles-panel .tp-gauge,
      #flyover-dashboard damocles-panel #damocles-aux,
      #flyover-dashboard damocles-panel #damocles-right {
        display: none;
      }

      [hidden] {
        display: none;
      }

      [role='alert'] {
        color: #ffd7d7;
        border-left: 3px solid #c85e5e;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Flyover</h1>
      <canvas id="flyover" role="img" aria-label="Orbital Flyover view" hidden>
        Your browser cannot display the Orbital Flyover canvas.
      </canvas>
      <section
        id="flyover-dashboard"
        role="region"
        aria-label="Flyover navigation dashboard"
        hidden
      >
        <div id="flyover-panel-scale">
          <damocles-panel id="panel-damocles"></damocles-panel>
        </div>
      </section>
      <p id="status" role="status">Loading System presentation document…</p>
      <p id="notice" role="status" hidden></p>
      <p id="failure" role="alert" hidden></p>
    </main>
    <script type="module" src="/src/flyover/boot.ts"></script>
  </body>
</html>
