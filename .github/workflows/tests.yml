name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# Neither job needs Restricted Material: the tests read the tracked Data
# Payload and Golden Traces. The e2e tests run nightly, in e2e.yml.
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run typecheck:research
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test:tools
  # The few tests that assert Apple's libm bit-for-bit (ADR 0022) skip here;
  # see test/replay/platform.ts. Four shards, balanced by test-timings.json,
  # keep each job to a few minutes.
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: web
    steps:
      # Research tests read sources at historical revisions.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run test:quiet --shard=${{ matrix.shard }}/4
