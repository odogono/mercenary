name: Pages

# Publish the Published Site to GitHub Pages, rebuilt from each push to main. It
# serves at https://opendoorgonorth.com/mercenary/ (ADR 0093).
#
# Everything it needs is tracked: the source, the Data Payload (ADR 0029), the
# Targ assets and settings.json. The export is checked by loading every page
# under /mercenary/ before it is uploaded.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push supersedes a queued deploy, but never cancels a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run export:site
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
